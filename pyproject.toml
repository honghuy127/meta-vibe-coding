[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-vibe-coding"
version = "0.1.0"
description = "Technical stewardship for non-expert software ideas"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meta_vibe_coding = ["static/*", "prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
